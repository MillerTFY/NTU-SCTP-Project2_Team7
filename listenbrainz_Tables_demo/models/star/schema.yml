version: 2

models:

  - name: dim_user
    description: "User dimension"
    columns:
      - name: user_name
        tests:
          - unique
          - not_null

  - name: dim_artist
    description: "Artist dimension"
    columns:
      - name: artist_msid
        tests:
          - unique
          - not_null
      - name: artist_name
        tests:
          - dbt_expectations.expect_column_values_to_not_be_null:
              config:
                severity: warn
                description: >
                  Null artist names corrupt top-artist charts.

  - name: dim_track
    description: "Track dimension from snapshot"
    columns:
      - name: recording_msid
        tests:
          - unique
          - not_null

  - name: dim_release
    description: "Release dimension"
    columns:
      - name: release_msid
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Date dimension"
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: fct_user_metrics
    description: "User engagement metrics"
    columns:
      - name: user_name
        tests:
          - unique
          - not_null
      - name: total_listens
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 500000
              config:
                severity: warn
                description: >
                  Users above 500k listens are outliers.
      - name: avg_listens_per_day
        tests:
          - not_null
          - dbt_expectations.expect_column_mean_to_be_between:
              min_value: 0.1
              max_value: 100
              config:
                severity: warn
                description: >
                  Platform average engagement KPI for CEO presentation.
      - name: preferred_time_of_day
        tests:
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Morning', 'Afternoon', 'Evening', 'Night']
              config:
                severity: error
                description: >
                  Validates CMO audience time-of-day segments.